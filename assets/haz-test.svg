<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1222"/>
      <stop offset="1" stop-color="#070B15"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="numGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <ellipse cx="180" cy="40" rx="640" ry="420" fill="url(#glowC)"/>
  <ellipse cx="1480" cy="880" rx="620" ry="420" fill="url(#glowV)"/>
  <rect x="0" y="0" width="1600" height="3" fill="url(#barGrad)" opacity="0.9"/>

  <!-- Header -->
  <rect x="64" y="46" width="168" height="34" rx="17" fill="#101C33" stroke="#22D3EE" stroke-opacity="0.45"/>
  <text x="148" y="68" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2.4" fill="#22D3EE">AGENT SKILL</text>

  <text x="64" y="150" font-size="78" font-weight="800" fill="#F8FAFC">haz-<tspan fill="url(#tgrad)">test</tspan></text>
  <text x="66" y="196" font-size="25" fill="#93A4C8">Assert the visible outcome, run the real code, stub only the edges.</text>

  <rect x="1136" y="48" width="400" height="40" rx="20" fill="#101C33" stroke="#2A3A5C"/>
  <circle cx="1164" cy="68" r="6" fill="#34D399"/>
  <text x="1182" y="74" font-size="15" fill="#A9B7D4">Works on new and existing projects</text>

  <!-- Arrows between steps -->
  <g stroke="#3B82F6" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M323 480 H343"/><path d="M336 472 L344 480 L336 488"/>
    <path d="M631 480 H651"/><path d="M644 472 L652 480 L644 488"/>
    <path d="M939 480 H959"/><path d="M952 472 L960 480 L952 488"/>
    <path d="M1247 480 H1267"/><path d="M1260 472 L1268 480 L1260 488"/>
  </g>

  <!-- Step cards -->
  <g fill="#0F1729" stroke="#24314F">
    <rect x="48" y="300" width="272" height="360" rx="22"/>
    <rect x="356" y="300" width="272" height="360" rx="22"/>
    <rect x="664" y="300" width="272" height="360" rx="22"/>
    <rect x="972" y="300" width="272" height="360" rx="22"/>
    <rect x="1280" y="300" width="272" height="360" rx="22"/>
  </g>

  <!-- Step 1 -->
  <g>
    <circle cx="92" cy="348" r="18" fill="url(#numGrad)"/>
    <text x="92" y="354" text-anchor="middle" font-size="16" font-weight="700" fill="#06121F">1</text>
    <g transform="translate(276,348)" stroke="#8FA3C8" stroke-width="2.2" stroke-linecap="round" fill="none">
      <circle cx="0" cy="0" r="8"/>
      <path d="M6 6 L13 13"/>
    </g>
    <text x="72" y="412" font-size="24" font-weight="700" fill="#F1F5F9">Scan the repo</text>
    <g font-size="16" fill="#93A4C8">
      <text x="72" y="456">Does it already test</text>
      <text x="72" y="480">this way? Find the</text>
      <text x="72" y="504">runner, layout and</text>
      <text x="72" y="528">its conventions.</text>
    </g>
    <rect x="72" y="596" width="120" height="30" rx="15" fill="#101C33" stroke="#2A3A5C"/>
    <text x="132" y="616" text-anchor="middle" font-size="13" fill="#7DD3FC">read, do not ask</text>
  </g>

  <!-- Step 2 -->
  <g>
    <circle cx="400" cy="348" r="18" fill="url(#numGrad)"/>
    <text x="400" y="354" text-anchor="middle" font-size="16" font-weight="700" fill="#06121F">2</text>
    <g transform="translate(584,348)" stroke="#8FA3C8" stroke-width="2.2" stroke-linejoin="round">
      <rect x="-12" y="-12" width="15" height="15" rx="3" fill="none"/>
      <rect x="-2" y="-2" width="15" height="15" rx="3" fill="#0F1729"/>
    </g>
    <text x="380" y="412" font-size="24" font-weight="700" fill="#F1F5F9">Reuse or add</text>
    <g font-size="16" fill="#93A4C8">
      <text x="380" y="456">Same style: follow</text>
      <text x="380" y="480">it, never rewrite</text>
      <text x="380" y="504">passing tests. No</text>
      <text x="380" y="528">tests: add the runner.</text>
    </g>
    <rect x="380" y="596" width="132" height="30" rx="15" fill="#101C33" stroke="#2A3A5C"/>
    <text x="446" y="616" text-anchor="middle" font-size="13" fill="#7DD3FC">zero disruption</text>
  </g>

  <!-- Step 3 -->
  <g>
    <circle cx="708" cy="348" r="18" fill="url(#numGrad)"/>
    <text x="708" y="354" text-anchor="middle" font-size="16" font-weight="700" fill="#06121F">3</text>
    <g transform="translate(892,348)" stroke="#8FA3C8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M0 -13 L11 -7 V2 C11 9 5 13 0 15 C-5 13 -11 9 -11 2 V-7 Z"/>
      <path d="M-4 1 L-1 4 L5 -3"/>
    </g>
    <text x="688" y="412" font-size="24" font-weight="700" fill="#F1F5F9">List invariants</text>
    <g font-size="16" fill="#93A4C8">
      <text x="688" y="456">Money, access, user</text>
      <text x="688" y="480">data: rules that must</text>
      <text x="688" y="504">never break. One</text>
      <text x="688" y="528">test each, minimum.</text>
    </g>
    <rect x="688" y="596" width="120" height="30" rx="15" fill="#101C33" stroke="#2A3A5C"/>
    <text x="748" y="616" text-anchor="middle" font-size="13" fill="#7DD3FC">business rules</text>
  </g>

  <!-- Step 4 -->
  <g>
    <circle cx="1016" cy="348" r="18" fill="url(#numGrad)"/>
    <text x="1016" y="354" text-anchor="middle" font-size="16" font-weight="700" fill="#06121F">4</text>
    <g transform="translate(1200,348)" stroke="#8FA3C8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-8 -12 H8 M-8 -12 V4 L-2 14 H2 L8 4 V-12"/>
      <path d="M-8 0 H8"/>
    </g>
    <text x="996" y="412" font-size="24" font-weight="700" fill="#F1F5F9">Expect, not copy</text>
    <g font-size="16" fill="#93A4C8">
      <text x="996" y="456">Given X, expect Y.</text>
      <text x="996" y="480">Real code; stubs</text>
      <text x="996" y="504">only for network,</text>
      <text x="996" y="528">clock and database.</text>
    </g>
    <rect x="996" y="590" width="196" height="36" rx="10" fill="#0B1424" stroke="#2A3A5C"/>
    <text x="1094" y="614" text-anchor="middle" font-size="15" font-family="Consolas, Menlo, monospace" fill="#67E8F9">given X -&gt; expect Y</text>
  </g>

  <!-- Step 5 -->
  <g>
    <circle cx="1324" cy="348" r="18" fill="url(#numGrad)"/>
    <text x="1324" y="354" text-anchor="middle" font-size="16" font-weight="700" fill="#06121F">5</text>
    <g transform="translate(1508,348)" stroke-width="2.2" stroke-linecap="round" fill="none">
      <circle cx="-6" cy="0" r="6" stroke="#F87171"/>
      <circle cx="8" cy="0" r="6" stroke="#34D399"/>
    </g>
    <text x="1304" y="412" font-size="24" font-weight="700" fill="#F1F5F9">Red, then green</text>
    <g font-size="16" fill="#93A4C8">
      <text x="1304" y="456">Every bug fix ships</text>
      <text x="1304" y="480">a test that fails</text>
      <text x="1304" y="504">without it. Show</text>
      <text x="1304" y="528">both runs, always.</text>
    </g>
    <circle cx="1324" cy="606" r="6" fill="#F87171"/>
    <text x="1340" y="612" font-size="14" fill="#FCA5A5">fails</text>
    <path d="M1384 606 H1404" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M1398 601 L1404 606 L1398 611" stroke="#64748B" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1424" cy="606" r="6" fill="#34D399"/>
    <text x="1440" y="612" font-size="14" fill="#6EE7B7">passes</text>
  </g>

  <!-- Bottom panel -->
  <rect x="48" y="706" width="1504" height="164" rx="22" fill="#0D1526" stroke="#1E2A44"/>
  <line x1="800" y1="728" x2="800" y2="848" stroke="#1E2A44" stroke-width="1.5"/>

  <g>
    <circle cx="110" cy="756" r="18" fill="#F87171" fill-opacity="0.12" stroke="#F87171" stroke-opacity="0.5"/>
    <path d="M104 750 L116 762 M116 750 L104 762" stroke="#F87171" stroke-width="2.2" stroke-linecap="round"/>
    <text x="142" y="762" font-size="21" font-weight="700" fill="#E2E8F0">Skip when there is nothing to protect</text>
    <g font-size="16" fill="#93A4C8">
      <text x="88" y="800">Landing pages, docs, static config: 0 to 2 tests is enough.</text>
      <text x="88" y="826">No tests for getters, trivial wiring or generated HTML.</text>
    </g>
  </g>

  <g>
    <circle cx="862" cy="756" r="18" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-opacity="0.5"/>
    <path d="M862 748 V758 M862 764 V765" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round"/>
    <text x="894" y="762" font-size="21" font-weight="700" fill="#E2E8F0">Never assert AI tone or wording quality</text>
    <g font-size="16" fill="#93A4C8">
      <text x="840" y="800">That is validated with real users and real conversations.</text>
      <text x="840" y="826">Tests pin contracts, rules and data, not personality.</text>
    </g>
  </g>

  <text x="800" y="940" text-anchor="middle" font-size="17" fill="#7C8BAE">New project: one invariant, then its failing test, then the code. Existing project: baseline first, never rewrite what passes.</text>
</svg>
